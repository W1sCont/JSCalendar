<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p id="datePrompt">Виберіть дату:</p>
    <input type="date" id="dateInput" value="2026-08-15" />
    <table id="table">
        <tr id="days">
            <th class="style-regular-day">Пн</th>
            <th class="style-regular-day">Вт</th>
            <th class="style-regular-day">Ср</th>
            <th class="style-regular-day">Чт</th>
            <th class="style-regular-day">Пт</th>
            <th class="style-weekend-day">Сб</th>
            <th class="style-weekend-day">Нд</th>
        </tr>
    </table>
    <script src="script.js"></script>
</body>
</html>
